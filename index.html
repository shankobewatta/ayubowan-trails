<style>
:root{--maroon:#8D153A;--gold:#EAB200;--green:#00534E;--teal:#0E7C86;--tea:#5B8C3A;--cin:#A0522D;--bg:#FFF6E5;--card:#fff;--ink:#2B2B2B;--mute:#6b5f55;--line:#ead9b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1416;--card:#2a1d20;--ink:#f6e9d2;--mute:#c4b199;--line:#4a3438}}
:root[data-theme="dark"]{--bg:#1d1416;--card:#2a1d20;--ink:#f6e9d2;--mute:#c4b199;--line:#4a3438}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Noto Sans','Noto Sans Sinhala','Noto Sans Tamil',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:'Playfair Display','Noto Serif Sinhala',Georgia,serif;margin:0;line-height:1.15}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(160deg,var(--gold) -40%,var(--maroon) 55%,#5a0c25);color:#fff;padding:22px 0 26px;position:relative;overflow:hidden;border-radius:0 0 28px 28px}
.hero svg.moon{position:absolute;right:-70px;top:-50px;width:280px;opacity:.28}
.hero h1{font-size:34px;font-weight:800}.hero p{margin:6px 0 16px;opacity:.92}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top button{background:#ffffff26;color:#fff;border:0;border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}
.search{background:var(--card);color:var(--ink);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.search input,.search select,.f input,.f select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.search .go{grid-column:1/3}
.btn{background:var(--maroon);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:600 15px 'Noto Sans',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:var(--green)}.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;font-size:12px;cursor:pointer;color:var(--ink)}

.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}.sec h2{font-size:22px;color:var(--maroon)}

.sec:after{content:"";flex:1;height:8px;background:radial-gradient(circle at 4px 4px,var(--gold) 2.5px,transparent 3px) 0 0/12px 8px repeat-x;opacity:.8}
.rail{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.rail .card{min-width:230px;scroll-snap-align:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 3px 12px #8d153a14;margin-bottom:12px}
.pic{height:110px;display:flex;align-items:flex-end;justify-content:space-between;padding:10px;color:#fff;font-size:40px;position:relative}
.pic span{font:600 12px 'Noto Sans',sans-serif;background:#0006;border-radius:10px;padding:2px 8px}
.body{padding:12px 14px 14px}.body h3{font-size:18px;margin-bottom:3px}.mute{color:var(--mute);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tag{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 6px}.chip{white-space:nowrap;border:1.5px solid var(--green);color:var(--green);background:transparent;border-radius:20px;padding:5px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--gold);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:9px 0 8px;font:12px 'Noto Sans',sans-serif;cursor:pointer}
nav button b{display:block;font-size:20px}nav button[aria-current=true]{color:var(--maroon);font-weight:600}
:root[data-theme=dark] nav button[aria-current=true]{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav button[aria-current=true]{color:var(--gold)}}
.map{background:linear-gradient(#cfe9ec,#b5dce0);border-radius:18px;border:1px solid var(--line);width:100%}
.dish{min-width:170px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.on{display:flex}.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.f{display:grid;gap:10px;margin:12px 0}.demo{background:var(--gold);color:#2B2B2B;border-radius:8px;padding:4px 10px;font-size:12px;display:inline-block}
.lotus{font-size:64px;text-align:center;animation:bloom .9s ease-out}
@keyframes bloom{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.lotus{animation:none}}
.sw{display:flex;gap:6px;justify-content:flex-end}.sw button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 10px;cursor:pointer}.sw button[aria-pressed=true]{background:var(--maroon);color:#fff}
.demonote{font-size:12px;color:var(--mute);text-align:center;margin:18px 0}

const foodCard=f=>`<article class="card"><div class="body"><h3>${f.e} ${f.n}</h3><div class="mute">${f.t} · ${f.c} · ${f.b}</div><p>${f.d}</p><div class="tags">${f.diet.map(x=>`<span class="tag">${x}</span>`).join('')}</div><a class="btn ghost" target="_blank" rel="noopener" href="${maps(f.n+' '+f.c)}">Open in Google Maps</a></div></article>`;
function mapSvg(){const W=300,H=420,P=([la,lo])=>[((lo-79.6)/2.3*W).toFixed(0),((9.95-la)/4.1*H).toFixed(0)];
const out=[[9.8,80.1],[9.5,80.9],[8.6,81.2],[7.7,81.7],[6.9,81.85],[6.2,81.4],[5.95,80.6],[6.4,80.0],[7.2,79.85],[8.2,79.8],[9.0,79.9]].map(P).join(' ');
const pins=Object.entries(CITY).map(([n,ll])=>{const[x,y]=P(ll);return `<a href="${maps(n)}" target="_blank" rel="noopener"><circle cx="${x}" cy="${y}" r="7" fill="#8D153A" stroke="#EAB200" stroke-width="2.5"/><text x="${+x+10}" y="${+y+4}" font-size="11" fill="#2B2B2B" font-family="Noto Sans,sans-serif">${n}</text></a>`}).join('');
return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of Sri Lanka with destinations"><polygon points="${out}" fill="#5B8C3A" stroke="#00534E" stroke-width="3" stroke-linejoin="round"/>${pins}</svg>`}
function render(){drawNav();let h='';
if(tab==='home'){h=`<div class="cats">${[['stay','🛏️','Stay'],['eat','🍛','Eat'],['places','🏯','Explore'],['map','🗺️','Map']].map(([k,i,l])=>`<button class="cat" data-go="${k}"><b>${i}</b>${l}</button>`).join('')}</div>
<div class="sec"><h2>Trending this season</h2></div><div class="rail">${PLACES.slice(0,4).map(placeCard).join('')}</div>
<div class="sec"><h2>Hidden gems</h2></div><div class="rail">${HOTELS.filter(x=>x.eco).map(hotelCard).join('')}</div>
<div class="sec"><h2>Must-try dishes</h2></div><div class="rail">${DISHES.map(d=>`<div class="dish"><div style="font-size:30px">${d[1]}</div><b>${d[0]}</b><div class="mute">${d[2]?'🌶️'.repeat(d[2]):'Mild'}</div></div>`).join('')}</div>
<div class="sec"><h2>Before you go</h2></div><div class="card"><div class="body"><p><b>Emergency:</b> Police 119 · Ambulance 1990 · Tourist Police +94 11 242 1052</p><p class="mute">Temples: remove shoes and hats, cover shoulders and knees, never pose with your back to a Buddha statue.</p></div></div>`}
if(tab==='stay'){const ts=[...new Set(HOTELS.map(x=>x.t))];h=`<div class="sec"><h2>Where to stay</h2></div>${chips(ts,'stay')}${HOTELS.filter(x=>filter.stay==='All'||x.t===filter.stay).map(hotelCard).join('')}`}
if(tab==='places'){const ts=[...new Set(PLACES.map(x=>x.t))];h=`<div class="sec"><h2>Places to visit</h2></div>${chips(ts,'pl')}${PLACES.filter(x=>filter.pl==='All'||x.t===filter.pl).map(placeCard).join('')}`}
if(tab==='transport'){h='<div class="sec"><h2>Getting around Sri Lanka</h2></div><div class="card"><div class="body"><h3>🚕 PickMe</h3><p>Find tuk-tuks, cars, vans and other ride options where available. Check the pickup point and fare estimate in the PickMe app before confirming.</p><a class="btn" target="_blank" rel="noopener" href="https://pickme.lk/services/ride/">PickMe ride information</a> <a class="btn ghost" target="_blank" rel="noopener" href="https://pickme.lk/">Official website</a></div></div><div class="card"><div class="body"><h3>Plan a route</h3><p class="mute">Travel times depend on traffic and road conditions.</p><a class="btn alt" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=Colombo%2C%20Sri%20Lanka&destination=Ella%2C%20Sri%20Lanka">Colombo to Ella directions</a></div></div><div class="card"><div class="body"><h3>Long-distance transfers</h3><p>For multi-stop journeys or groups, compare registered taxi operators.</p><a class="btn ghost" target="_blank" rel="noopener" href="https://srilanka.travel/taxi_opperator">Sri Lanka Tourism taxi directory</a></div></div>'}
if(tab==='eat'){h=`<div class="sec"><h2>Where to eat</h2></div>${chips(['Halal','Vegetarian','Vegan'],'eat')}${FOOD.filter(x=>filter.eat==='All'||x.diet.includes(filter.eat)).map(foodCard).join('')||'<p class="mute">No spots match yet. Try another filter.</p>'}`}
if(tab==='map'){h=`<div class="sec"><h2>Island map</h2></div>${mapSvg()}<p class="mute">Tap a pin to open it in Google Maps.</p>${[...PLACES.map(p=>p.n+'|'+p.c),...HOTELS.map(x=>x.n+'|'+x.c),...FOOD.map(x=>x.n+'|'+x.c)].map(s=>{const[n,c]=s.split('|');return `<div class="card"><div class="body row" style="margin:0"><div><b>${n}</b><div class="mute">${c}</div></div><a class="btn alt" target="_blank" rel="noopener" href="${dirs(n+' '+c)}">Directions</a></div></div>`}).join('')}`}
$('#app').innerHTML=h+'<p class="demonote">🐘 Demo build. Sample data and mock payments only. Prices are illustrative.</p>';
if(tab==='home'){const d=$('#dest');}}
$('#dest').innerHTML='<option>Anywhere in Sri Lanka</option>'+Object.keys(CITY).map(c=>`<option>${c}</option>`).join('');
function go(k){tab=k;render();window.scrollTo({top:0})}
function book(n){const h=HOTELS.find(x=>x.n===n);$('#sheet').innerHTML=`<h2>Book ${h.n}</h2><span class="demo">Demo payment. No money is taken.</span><div class="f"><input type="date" aria-label="Check in"><input type="date" aria-label="Check out"><select aria-label="Guests"><option>1 guest</option><option selected>2 guests</option><option>3 guests</option><option>4 guests</option></select><input placeholder="Full name" aria-label="Full name"><input type="email" placeholder="Email" aria-label="Email"><input placeholder="Card number (any number)" aria-label="Card number" inputmode="numeric"></div><div class="row"><b>${money(h.p)} / night</b><button class="btn" id="pay">Confirm booking</button></div><p style="text-align:center"><button class="btn ghost" data-close>Cancel</button></p>`;$('#modal').classList.add('on')}
function done(){const ref='AT-'+Math.random().toString(36).slice(2,8).toUpperCase();$('#sheet').innerHTML=`<div class="lotus">🪷</div><h2 style="text-align:center">Booking confirmed</h2><p style="text-align:center">Your reference is <b>${ref}</b>. Istuti, thank you!</p><p style="text-align:center"><button class="btn" data-close>Done</button></p>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-f],[data-book],[data-close],#pay,#cur,#modal');if(!t)return;
if(t.dataset.go)go(t.dataset.go);
else if(t.dataset.f){const[k,v]=t.dataset.f.split('|');filter[k]=v;render()}
else if(t.dataset.book)book(t.dataset.book);
else if(t.id==='pay')done();
else if(t.id==='cur'){cur=cur==='LKR'?'USD':'LKR';t.textContent=cur;try{localStorage.setItem('cur',cur)}catch(x){}render()}
else if(t.hasAttribute('data-close')||(t.id==='modal'&&e.target===t))$('#modal').classList.remove('on')});
$('#cur').textContent=cur;render();
</script></body></html>
